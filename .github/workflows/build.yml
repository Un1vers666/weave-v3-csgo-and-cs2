'@ | Set-Content -Path (Join-Path $shimDir "lua.hpp")
            Write-Host "Created shim lua.hpp"
          }

          "shim_dir=$shimDir" >> $env:GITHUB_OUTPUT

      - name: Detect latest Windows 10 SDK
        id: sdk
        shell: pwsh
        run: |
          $kitsRoot = "C:\Program Files (x86)\Windows Kits\10\Include"
          $latestSdk = Get-ChildItem -Path $kitsRoot -Directory |
            Where-Object { $_.Name -match '^10\.0\.\d+\.\d+$' } |
            Sort-Object { [version]$_.Name } -Descending |
            Select-Object -First 1 -ExpandProperty Name

          if (-not $latestSdk) {
            throw "No Windows 10 SDK found in $kitsRoot"
          }

          Write-Host "Using WindowsTargetPlatformVersion: $latestSdk"
          "version=$latestSdk" >> $env:GITHUB_OUTPUT

      - name: Build Solution
        working-directory: ./csgo
        shell: pwsh
        run: |
          $shim = "${{ steps.patch.outputs.shim_dir }}"
          $args = @(
            "csgo_internal.sln",
            "/p:Configuration=Release",
            "/p:Platform=x86",
            "/p:WindowsTargetPlatformVersion=${{ steps.sdk.outputs.version }}",
            "/p:ExternalIncludePath=$shim",
            "/m",
            "/v:m"
          )
          & msbuild @args
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Locate built DLLs
        id: dll
        shell: pwsh
        run: |
          $found = Get-ChildItem -Path ".\csgo" -Filter "*.dll" -Recurse |
            Where-Object { $_.FullName -match '\\Release\\' }

          if (-not $found) {
            Write-Host "All DLLs in workspace:"
            Get-ChildItem -Path "." -Filter "*.dll" -Recurse | Select-Object -ExpandProperty FullName
            throw "No Release DLL found after build."
          }

          $found | ForEach-Object { Write-Host "Found DLL: $($_.FullName)" }
          $firstDir = Split-Path -Parent $found[0].FullName
          "dir=$firstDir" >> $env:GITHUB_OUTPUT

      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: Weave-CSGO-DLL
          path: ${{ steps.dll.outputs.dir }}/*.dll
          if-no-files-found: error

name: Build Weave Internal

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: 

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Install vcpkg dependencies
      run: |
        vcpkg install freetype:x86-windows-static
        vcpkg integrate install

    - name: Build Solution
      working-directory: ./csgo
      run: msbuild csgo_internal.sln /p:Configuration=Release /p:Platform=x86 /m /v:m

    - name: Upload DLL
      uses: actions/upload-artifact@v4
      with:
        name: Weave-CSGO-DLL
        path: ./csgo/csgo_internal/Release/*.dll
        if-no-files-found: error

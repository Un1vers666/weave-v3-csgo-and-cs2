name: Build Weave Internal

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: |
            C:\vcpkg\installed
            ${{ runner.tool_cache }}\vcpkg
            $env:LOCALAPPDATA\vcpkg
          key: ${{ runner.os }}-vcpkg-freetype-x86-windows-static

      - name: Install DirectX SDK (June 2010)
        shell: pwsh
        run: |
          $url = "https://download.microsoft.com/download/A/E/7/AE743F1F-632B-4809-87A9-AA1BB3458E31/DXSDK_Jun10.exe"
          $installer = "$env:TEMP\DXSDK_Jun10.exe"
          Invoke-WebRequest -Uri $url -OutFile $installer
          $proc = Start-Process -FilePath $installer -ArgumentList "/U /Q" -Wait -PassThru
          Write-Host "DXSDK installer exit code: $($proc.ExitCode)"

      - name: Install vcpkg dependencies
        run: |
          vcpkg install freetype:x86-windows-static
          vcpkg integrate install

      - name: Patch source compatibility & missing headers
        id: patch
        shell: pwsh
        run: |
          $shimDir = Join-Path $env:RUNNER_TEMP "weave_shims"
          New-Item -ItemType Directory -Path $shimDir -Force | Out-Null

          function Ensure-Include($filePath, $header) {
            if (-not (Test-Path $filePath)) { return }
            $content = Get-Content -Path $filePath -Raw
            if ($content -notmatch [regex]::Escape("#include <$header>")) {
              $updated = "#include <$header>rn" + $content
              Set-Content -Path $filePath -Value $updated -NoNewline
              Write-Host "Added #include <$header> to $filePath"
            }
          }

          Ensure-Include "csgo/csgo_internal/src/render.hpp" "mutex"
          Ensure-Include "csgo/csgo_internal/src/features/visuals/hitmarker.hpp" "mutex"
          Ensure-Include "csgo/csgo_internal/src/utils/math.cpp" "mutex"

          $controlsPath = "csgo/csgo_internal/deps/weave-gui/controls/controls.cpp"
          if (Test-Path $controlsPath) {
            $lines = Get-Content -Path $controlsPath
            for ($i = 0; $i -lt $lines.Count; $i++) {
              if ($lines[$i] -match 'std::make_format_args\(([^)]+)\)') {
                $arg = $matches[1].Trim()
                if ($arg -notmatch '^[a-zA-Z_][a-zA-Z0-9_]*$') {
                  $varName = "weave_fmt_arg_$i"
                  $indent = ($lines[$i] -match '^(\s*)') ? $matches[1] : ""
                  $decl = "${indent}auto $varName = $arg;"
                  $lines[$i] = $lines[$i] -replace 'std::make_format_args\(([^)]+)\)', "std::make_format_args($varName)"
                  $lines = $lines[0..($i-1)] + @($decl) + $lines[$i..($lines.Count-1)]
                  $i++
                  Write-Host "Patched make_format_args around line $i in controls.cpp"
                }
              }
            }
            Set-Content -Path $controlsPath -Value ($lines -join "rn") -NoNewline
          }

          $hasDiscord = Get-ChildItem -Path "csgo" -Filter "discord_register.h" -Recurse -ErrorAction SilentlyContinue
          if (-not $hasDiscord) {
            @'
